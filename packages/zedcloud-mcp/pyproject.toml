[project]
name = "zedcloud-mcp"
version = "0.1.0"
description = "MCP server exposing ZEDEDA Zedcloud operations via the zedcloud SDK"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "vignesh-zededa" }]
dependencies = [
  "zedcloud",
  "mcp>=1.0.0",
]

[project.scripts]
zedcloud-mcp = "zedcloud_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zedcloud_mcp"]

[tool.uv.sources]
zedcloud = { workspace = true }
