[project]
name = "zedcloud-automation"
version = "0.1.0"
description = "Pytest fixtures and helpers for ZEDEDA Zedcloud API automation"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "vignesh-zededa" }]
dependencies = [
  "zedcloud",
  "pytest>=8.0.0",
]

[project.entry-points.pytest11]
zedcloud_automation = "zedcloud_automation.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zedcloud_automation"]

[tool.uv.sources]
zedcloud = { workspace = true }
