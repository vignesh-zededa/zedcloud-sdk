name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync workspace
        run: uv sync --all-packages --group dev

      - name: Verify OpenAPI codegen is current
        run: |
          uv run python scripts/generate_from_openapi.py
          git diff --exit-code -- packages/zedcloud/src/zedcloud/_generated

      - name: Ruff
        run: |
          uv run ruff check packages scripts
          uv run ruff format --check packages scripts

      - name: Unit tests
        run: uv run pytest -q -m "not needs_cloud"

      - name: MCP tool list
        run: uv run python -c "from zedcloud_mcp.server import list_tool_names; print(list_tool_names())"
